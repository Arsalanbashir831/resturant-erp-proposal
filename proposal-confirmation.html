<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Proposal Confirmation — DotCode Solutions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{--ink:#1b1f1d;--kraft:#e9ddc5;--paper:#fbf8f1;--brass:#a8763c;--tomato:#8b2e1c;--muted:#6d6b63;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--kraft);color:var(--ink);font:16px/1.55 'Work Sans',sans-serif}
  header{background:var(--ink);color:var(--paper);padding:42px 24px 52px}
  header div,main{max-width:850px;margin:auto}
  .kicker{color:#c99a62;font:600 12px 'IBM Plex Mono',monospace;letter-spacing:.08em;text-transform:uppercase}
  h1,h2{font-family:'Fraunces',serif} h1{font-size:clamp(34px,6vw,54px);line-height:1.05;margin:12px 0 8px} h2{margin-top:32px}
  header p{margin:0;color:#c9c4b4}
  main{padding:0 24px 60px}
  .paper{background:var(--paper);margin-top:-24px;padding:clamp(24px,5vw,52px);box-shadow:0 12px 32px rgba(27,31,29,.18);border-radius:6px}
  .meta{padding:0;list-style:none;color:var(--muted)} .meta strong{color:var(--ink)}
  table{width:100%;border-collapse:collapse;margin:16px 0 22px} th,td{padding:12px 8px;border-bottom:1px solid #d8ccb5;text-align:left} th:last-child,td:last-child{text-align:right}
  .total{font:600 20px 'Fraunces',serif;border-top:2px solid var(--ink);padding-top:16px;text-align:right}
  .actions{display:flex;flex-wrap:wrap;gap:12px;margin:24px 0 0}
  button,a.button{border:0;border-radius:4px;padding:13px 18px;font:600 14px 'Work Sans',sans-serif;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
  .primary{background:var(--tomato);color:white}.secondary{background:var(--ink);color:white}.back{background:transparent;color:var(--ink);border:1px solid #9e9177!important}
  .status{min-height:24px;margin-top:14px;color:#55603f;font-weight:600}
  .missing{text-align:center;padding:28px}.missing p{color:var(--muted)}
  @media(max-width:560px){.paper{padding:24px 18px}.actions>*{width:100%}th,td{padding:10px 4px}}
  @media print{header{padding:20px}.paper{box-shadow:none;margin:0}.actions,.status{display:none}body{background:white}main{padding:0}}
</style>
</head>
<body>
<header><div><span class="kicker">DotCode Solutions</span><h1>Proposal confirmation</h1><p>Review, download, and share your restaurant ERP selection.</p></div></header>
<main><article class="paper" id="content" aria-live="polite"></article></main>
<script>
(function(){
  'use strict';
  var content = document.getElementById('content');
  var record;
  try{ record = JSON.parse(localStorage.getItem('dotcodeRestaurantProposalSelection')); }catch(err){}

  if(!record || !Array.isArray(record.modules)){
    content.innerHTML = '<div class="missing"><h2>No proposal found</h2><p>Create a selection before opening the confirmation page.</p><a class="button primary" href="restaurant-erp-proposal.html">Build a proposal</a></div>';
    return;
  }

  function esc(value){var d=document.createElement('div');d.textContent=String(value);return d.innerHTML;}
  function money(value){return '$'+Number(value || 0).toFixed(2);}
  function recurringText(item, suffix){return esc(item.label)+(item.price ? ' — '+money(item.price)+suffix : '');}

  var rows = record.modules.map(function(line){
    return '<tr><td>'+esc(line.label)+'</td><td>'+money(line.price)+'</td></tr>';
  }).join('');

  content.innerHTML =
    '<h2>Restaurant ERP Proposal — Client Selection</h2>'+
    '<ul class="meta"><li><strong>Prepared for:</strong> '+esc(record.client)+'</li><li><strong>Prepared by:</strong> '+esc(record.preparedBy)+' ('+esc(record.company)+')</li><li><strong>Generated:</strong> '+esc(new Date(record.generatedAt).toLocaleString())+'</li><li><strong>Quotation validity:</strong> '+esc(record.quotationValidity)+'</li></ul>'+
    '<h2>Selected modules</h2><table><thead><tr><th>Item</th><th>Cost</th></tr></thead><tbody>'+rows+'</tbody></table>'+
    '<p class="total">One-time implementation total: '+money(record.oneTimeTotal)+'</p>'+
    '<h2>Recurring platform costs <small>(reference only)</small></h2><ul><li>Odoo license: '+recurringText(record.recurring.odoo, '/yr')+'</li><li>Hosting: '+recurringText(record.recurring.hosting, '/mo')+'</li></ul>'+
    '<div class="actions"><button class="primary" id="pdfBtn">Download confirmation PDF</button><button class="secondary" id="shareBtn">Share confirmation</button><a class="button back" href="restaurant-erp-proposal.html">Back to proposal</a></div><p class="status" id="status" role="status"></p>';

  function createPdf(){
    var doc = new window.jspdf.jsPDF({unit:'pt',format:'a4'}), margin=48, y=48, width=doc.internal.pageSize.getWidth();
    function line(text, options){options=options||{};doc.setFont('helvetica',options.bold?'bold':'normal');doc.setFontSize(options.size||10.5);doc.text(String(text),options.x||margin,y);y+=options.gap||16;}
    line('Restaurant ERP Proposal — Confirmation',{bold:true,size:18,gap:28});
    line('Prepared for: '+record.client);line('Prepared by: '+record.preparedBy+' · '+record.company);line('Generated: '+new Date(record.generatedAt).toLocaleString());line('Quotation validity: '+record.quotationValidity,{gap:24});
    line('Selected modules',{bold:true,size:13,gap:20});
    record.modules.forEach(function(item){if(y>750){doc.addPage();y=48;}doc.text(item.label,margin+(item.sub?16:0),y);doc.text(money(item.price),width-margin-58,y);y+=16;});
    y+=8;doc.line(margin,y,width-margin,y);y+=22;line('One-time implementation total: '+money(record.oneTimeTotal),{bold:true,size:13,gap:30});
    line('Recurring platform costs (reference only)',{bold:true,size:12,gap:20});line('Odoo license: '+record.recurring.odoo.label+(record.recurring.odoo.price?' — '+money(record.recurring.odoo.price)+'/yr':''));line('Hosting: '+record.recurring.hosting.label+(record.recurring.hosting.price?' — '+money(record.recurring.hosting.price)+'/mo':''),{gap:26});
    line('This client-generated summary is subject to confirmation by DotCode Solutions.',{size:9});
    return doc;
  }

  document.getElementById('pdfBtn').addEventListener('click',function(){createPdf().save('restaurant-erp-proposal-confirmation.pdf');});
  document.getElementById('shareBtn').addEventListener('click',async function(){
    var status=document.getElementById('status');
    try{
      var blob=createPdf().output('blob');
      var file=new File([blob],'restaurant-erp-proposal-confirmation.pdf',{type:'application/pdf'});
      if(navigator.share && (!navigator.canShare || navigator.canShare({files:[file]}))){
        await navigator.share({title:'Restaurant ERP Proposal',text:'Restaurant ERP proposal confirmation from DotCode Solutions.',files:[file]});
        status.textContent='Confirmation shared.';
      }else if(navigator.clipboard){
        await navigator.clipboard.writeText(window.location.href);status.textContent='Sharing is unavailable here, so the confirmation link was copied.';
      }else{createPdf().save('restaurant-erp-proposal-confirmation.pdf');status.textContent='Sharing is unavailable here. The PDF was downloaded instead.';}
    }catch(err){if(err.name!=='AbortError')document.getElementById('status').textContent='Could not share the confirmation. Please download the PDF instead.';}
  });
})();
</script>
</body>
</html>
